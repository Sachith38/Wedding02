<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nisal & Nisali | Wedding Invitation</title>
    
    <meta property="og:title" content="Nisal & Nisali's Wedding Invitation">
    <meta property="og:description" content="We are getting married! Click to see our invitation and countdown.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=400">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #444;
            padding: 20px;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.6); 
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
            border: 3px double #d4af37;
        }
        /* Music Control Button */
        #music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: #b8860b;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: #b8860b;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .names span { color: #444; font-size: 2rem; display: block; }
        #countdown { display: flex; justify-content: space-around; gap: 10px; }
        .time-box {
            background: #b8860b;
            color: white;
            padding: 10px;
            border-radius: 10px;
            flex: 1;
        }
        .time-box span { font-size: 1.4rem; font-weight: bold; display: block; }
        .rsvp-btn {
            background: #b8860b;
            color: white;
            padding: 12px 35px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
        }
    </style>
</head>
<body onclick="playMusic()">

    <div class="overlay"></div>

    <div id="music-control" onclick="toggleMusic(event)">
        <i id="music-icon" class="fas fa-volume-up"></i>
    </div>

    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <header>
            <h2 style="font-weight: 300; letter-spacing: 4px; text-transform: uppercase; font-size: 0.8rem; margin-bottom: 10px; color: #888;">Save The Date</h2>
            <h1 class="names">Nisal <span>&</span> Nisali</h1>
        </header>

        <section class="details" style="margin: 25px 0; font-size: 1rem; line-height: 1.8;">
            <p>We cordially invite you to celebrate our wedding day</p>
            <p><strong style="color: #b8860b;">May 20, 2026</strong></p>
            <p>Grand Ballroom, Cinnamon Grand Colombo</p>
        </section>

        <div id="countdown-container">
            <h3 style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; color: #666;">The Celebration Begins In</h3>
            <div id="countdown">
                <div class="time-box"><span id="days">00</span><p style="font-size: 0.6rem;">Days</p></div>
                <div class="time-box"><span id="hours">00</span><p style="font-size: 0.6rem;">Hours</p></div>
                <div class="time-box"><span id="minutes">00</span><p style="font-size: 0.6rem;">Mins</p></div>
                <div class="time-box"><span id="seconds">00</span><p style="font-size: 0.6rem;">Secs</p></div>
            </div>
        </div>

        <div class="footer" style="margin-top: 30px;">
            <p style="margin-bottom: 15px; font-style: italic; font-size: 0.9rem;">Your presence is our greatest gift!</p>
            <a href="https://wa.me/94773978827?text=Hi%20Nisal%20and%20Nisali,%20we%20are%20coming!" class="rsvp-btn">RSVP VIA WHATSAPP</a>
        </div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        const musicIcon = document.getElementById('music-icon');
        let isPlaying = false;

        function playMusic() {
            if (!isPlaying) {
                music.play().catch(e => console.log("Click to play music"));
                isPlaying = true;
            }
        }

        function toggleMusic(event) {
            event.stopPropagation();
            if (music.paused) {
                music.play();
                musicIcon.classList.replace('fa-volume-mute', 'fa-volume-up');
            } else {
                music.pause();
                musicIcon.classList.replace('fa-volume-up', 'fa-volume-mute');
            }
        }

        const countdown = () => {
            const countDate = new Date("2026/05/20 00:00:00").getTime();
            const now = new Date().getTime();
            const gap = countDate - now;

            const second = 1000;
            const minute = second * 60;
            const hour = minute * 60;
            const day = hour * 24;

            document.getElementById("days").innerText = Math.floor(gap / day);
            document.getElementById("hours").innerText = Math.floor((gap % day) / hour);
            document.getElementById("minutes").innerText = Math.floor((gap % hour) / minute);
            document.getElementById("seconds").innerText = Math.floor((gap % minute) / second);
        };
        setInterval(countdown, 1000);
        countdown();
    </script>
</body>
</html>
